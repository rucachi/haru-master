<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>나경이의 하루마스터 👧 (중3 일일 학습)</title>
  <meta name="description" content="나경이(중3) 전용 태블릿 스마트 일일 과제 & 에빙하우스 복습 앱">
  <meta name="theme-color" content="#8b5cf6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- KaTeX 수식 엔진 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <!-- 학생 태블릿 전용 스타일 -->
  <link rel="stylesheet" href="css/student.css">
</head>

<body>

  <!-- 학생 태블릿 상단 헤더 -->
  <header class="student-header">
    <div class="student-brand">
      <div class="student-avatar">👧</div>
      <div class="student-title-wrap">
        <h1>
          <span id="student-name-text">나경이의</span> 하루마스터
          <span class="student-grade-badge" id="student-grade-badge">중3학년</span>
        </h1>
      </div>
    </div>

    <div class="student-header-actions">
      <!-- S-Pen 연습장 열기 버튼 -->
      <button type="button" class="btn-spen-toggle" id="btn-toggle-spen" title="S펜 풀이 연습장 열기">
        <span>✏️</span> S펜 연습장
      </button>

      <!-- 클라우드 연동 상태 -->
      <div class="sync-badge">
        <span class="sync-dot"></span>
        <span>Firebase 동기화</span>
      </div>
    </div>
  </header>

  <!-- 과목 선택 탭 바 -->
  <div class="student-subject-bar" id="student-subject-bar">
    <button type="button" class="sub-tab-btn active" data-sub="ALL">✨ 전체 과목 (25문제)</button>
    <button type="button" class="sub-tab-btn" data-sub="수학">📐 수학 (8)</button>
    <button type="button" class="sub-tab-btn" data-sub="국어">📖 국어 독해 (4)</button>
    <button type="button" class="sub-tab-btn" data-sub="영어">🔤 영어 독해 (4)</button>
    <button type="button" class="sub-tab-btn" data-sub="과학">🔬 과학 (3)</button>
    <button type="button" class="sub-tab-btn" data-sub="사회">🌍 사회 (3)</button>
    <button type="button" class="sub-tab-btn" data-sub="역사">🏛️ 역사 (3)</button>
  </div>

  <!-- 일일 진행률 프로그레스 바 -->
  <div class="progress-container">
    <div class="progress-header">
      <span id="q-counter-text">문항 로딩 중...</span>
      <span id="progress-pct-text">0% 완료</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-bar-fill"></div>
    </div>
  </div>

  <!-- 메인 학습 뷰어 (좌: 문제, 우: S-Pen 풀이 연습장 2단 분할 레이아웃) -->
  <main class="student-main-content" id="student-main-content">

    <!-- 20문제 학습 완료 축하 화면 (완료 시 노출) -->
    <div id="completion-screen" style="display: none; width: 100%;"></div>

    <!-- 좌우 2단 분할 학습 워크스페이스 -->
    <div class="study-workspace-grid" id="study-workspace-grid">

      <!-- [좌측 50%] 문제 및 답안 선택 패널 -->
      <section class="study-pane-left" id="question-pane">
        <div class="q-card" id="q-card">
          <div class="q-meta-row">
            <div class="q-meta-left">
              <span class="q-subject-pill" id="q-subject-pill">수학</span>
              <span class="q-srs-badge" id="q-srs-badge" style="display: none;">🔥 에빙하우스 오답 복습</span>
            </div>
            <button type="button" class="btn-refresh-questions" id="btn-refresh-questions" title="현재 과목의 새로운 문제 세트를 불러옵니다">
              <span class="refresh-icon">🔄</span>
              <span id="refresh-btn-text">새 문제 받기</span>
            </button>
          </div>

          <!-- 지문 영역 (국어/영어) -->
          <div class="q-passage-box" id="q-passage-box" style="display: none;"></div>

          <!-- 문제 본문 -->
          <div class="q-text-body" id="q-text-body">
            문제를 불러오는 중입니다...
          </div>

          <!-- 다이어그램 (도형/실험도/그래프) -->
          <div class="q-diagram-box" id="q-diagram-box" style="display: none;">
            <img id="q-diagram-img" src="" alt="문제 다이어그램">
          </div>

          <!-- 보기 1~5번 -->
          <div class="q-options-container" id="q-options-container">
            <!-- 동적 생성 -->
          </div>

          <!-- 채점 후 해설 박스 -->
          <div class="q-explanation-card" id="q-explanation-card" style="display: none;"></div>

          <!-- 하단 액션 버튼 행 -->
          <div class="q-actions-row">
            <button type="button" class="btn-student-submit" id="btn-submit-answer" disabled>
              ✓ 답안 제출 및 채점
            </button>
            <button type="button" class="btn-student-next" id="btn-next-question" style="display: none;">
              다음 문제 풀기 ➔
            </button>
          </div>
        </div>
      </section>

      <!-- [우측 50%] S-Pen & 터치 풀이 연습장 패널 -->
      <section class="study-pane-right" id="spen-pane">
        <div class="spen-workspace-card">
          <!-- 상단 툴바 -->
          <div class="scratchpad-toolbar">
            <div class="scratchpad-tools-left">
              <span class="scratchpad-title">✏️ S펜 풀이장</span>
              <!-- 색상 팔레트 -->
              <div class="color-dot active" data-color="#ffffff" title="화이트"></div>
              <div class="color-dot" data-color="#fef08a" title="옐로우"></div>
              <div class="color-dot" data-color="#38bdf8" title="네온블루"></div>
              <div class="color-dot" data-color="#f43f5e" title="레드"></div>
              <div class="color-dot" data-color="#4ade80" title="민트"></div>
              <!-- 지우개 -->
              <button type="button" class="tool-btn eraser-btn" id="spen-eraser-btn" title="지우개 모드">🧹 지우개</button>
              <!-- 굵기 -->
              <select id="spen-width-select" class="tool-select" title="선 굵기">
                <option value="2">가는선 (2px)</option>
                <option value="4" selected>보통 (4px)</option>
                <option value="8">굵은선 (8px)</option>
              </select>
              <!-- 모눈격자 토글 -->
              <button type="button" class="tool-btn" id="spen-grid-btn" title="모눈종이 격자 토글">📐 모눈격자</button>
            </div>
            <div class="scratchpad-tools-right">
              <button type="button" class="tool-btn danger" id="spen-clear-btn" title="풀이 전체 지우기">🗑️ 싹 지우기</button>
              <button type="button" class="tool-btn" id="spen-collapse-btn" title="화면 분할 접기/펼치기">◀▶ 접기</button>
            </div>
          </div>
          <!-- 캔버스 드로잉 영역 -->
          <div class="scratchpad-canvas-wrap" id="scratchpad-canvas-wrap">
            <canvas class="scratchpad-canvas" id="spen-canvas"></canvas>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- 나경이(중3) 학생 설정 주입 -->
  <script>
    window.STUDENT_CONFIG = {
      id: 'nakyung',
      name: '나경이의',
      grade: 3,
      theme: 'nakyung'
    };
  </script>

  <!-- 학생 전용 로직 모듈 -->
  <script type="module" src="js/student-app.js?v=b78512f"></script>

</body>

</html>
